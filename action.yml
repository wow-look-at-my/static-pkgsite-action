name: 'Static Pkgsite'
description: 'Generate static Go package documentation using pkgsite and deploy to GitHub Pages'

inputs:
  path:
    description: 'Path to the Go module (or space-separated list of paths) to document. Defaults to the current directory.'
    required: false
    default: '.'
  go-version:
    description: 'Go version to use for building pkgsite and the documented module.'
    required: false
    default: 'stable'
  pkgsite-ref:
    description: 'Git ref (branch, tag, commit) of wow-look-at-my/static-pkgsite to build.'
    required: false
    default: 'master'
  out:
    description: 'Output directory for the generated static site.'
    required: false
    default: '_site'
  base-path:
    description: >-
      Base URL path prefix for the generated site. For GitHub Pages project
      sites this should be /<repo-name>/. Leave empty to auto-detect from the
      repository name (recommended).
    required: false
    default: ''

outputs:
  path:
    description: 'Path to the generated static site directory.'
    value: ${{ inputs.out }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build pkgsite
      shell: bash
      run: |
        GOBIN="$(pwd)/.pkgsite-bin" go install github.com/wow-look-at-my/static-pkgsite/cmd/pkgsite@${{ inputs.pkgsite-ref }}
        echo "$(pwd)/.pkgsite-bin" >> "$GITHUB_PATH"

    - name: Generate static site
      shell: bash
      env:
        INPUT_BASE_PATH: ${{ inputs.base-path }}
      run: |
        BASE_PATH="$INPUT_BASE_PATH"
        if [ -z "$BASE_PATH" ]; then
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER}"
          # User/org pages (repo named <owner>.github.io) are served from /
          if [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO_NAME}/"
          fi
        fi
        echo "Using base path: $BASE_PATH"
        pkgsite -base-path "$BASE_PATH" -out "${{ inputs.out }}" ${{ inputs.path }}

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.out }}
